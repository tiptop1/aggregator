[smtp_printer]
server = "smtp.gmail.com"
port = 587
# security = "tls"
username = "${smtp_login}"
password = "${smtp_passwd}"
from_email = "${smtp_from_email}"
to_emails = "${smtp_to_emails}"


[[services]]
category = "BTC"
endpoint = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true"

[services.headers]
x-cg-demo-api-key = "${coingecko_api_key}"

[services.fields]
price = "$.bitcoin.usd"
price_change_24h = "$.bitcoin.usd_24h_change"

[[services]]
category = "ETH"
endpoint = "https://api.coingecko.com/api/v3/simple/price?include_24hr_change=true&vs_currencies=usd&ids=eth0"

